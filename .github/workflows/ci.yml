name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 16777216

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build / test / 100% coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: recho
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: Coverage (100% gate, main.rs excluded — runtime entry only)
        run: |
          cargo llvm-cov --all-features --ignore-filename-regex 'main\.rs' --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100 --summary-only

  # Quality tools run as separate pinned jobs, not in the learner setup.
  pv-lint:
    name: pv-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pv
        env:
          PV_VERSION: v0.31.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="pv-${PV_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/paiml/aprender/releases/download/${PV_VERSION}/${archive}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${archive}/pv" "$RUNNER_TEMP/bin/pv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/pv" --version

      - name: Lint contracts
        run: pv lint contracts/

  pmat-comply:
    name: pmat-comply
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pmat
        env:
          PMAT_VERSION: v3.16.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="pmat-${PMAT_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/paiml/paiml-mcp-agent-toolkit/releases/download/${PMAT_VERSION}/${archive}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${archive}/pmat" "$RUNNER_TEMP/bin/pmat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/pmat" --version

      - name: pmat comply
        run: pmat comply

  gate:
    name: gate
    needs: [ci, pv-lint, pmat-comply]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a gate job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "all gates passed"
