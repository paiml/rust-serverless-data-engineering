<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" role="img" aria-labelledby="title desc">
  <title id="title">Rust Serverless Data Engineering</title>
  <desc id="desc">Hero banner: a Rust-and-lambda mark on the left, a serverless data pipeline through the middle, and the dark/light echo duality on the right.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="rust-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#b8482a"/>
    </linearGradient>
    <linearGradient id="lambda-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#cc6c00"/>
    </linearGradient>
    <linearGradient id="pipe-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5cc8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="moon-grad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5b6677"/>
      <stop offset="0.7" stop-color="#2a3140"/>
      <stop offset="1" stop-color="#161b22"/>
    </radialGradient>
    <radialGradient id="bulb-grad" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.5" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#a37500"/>
    </radialGradient>
    <radialGradient id="bulb-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid-fade" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f2733" stroke-width="1"/>
    </pattern>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1920" height="640" fill="url(#bg-grad)"/>
    <rect x="0" y="0" width="1920" height="640" fill="url(#grid-fade)" opacity="0.35"/>
    <rect x="0" y="612" width="1920" height="2" fill="#3d8bff" opacity="0.25"/>
    <rect x="0" y="26" width="1920" height="2" fill="#3d8bff" opacity="0.18"/>
  </g>

  <g id="title-mark" transform="translate(120, 180)">
    <g id="title-mark-cog">
      <circle cx="140" cy="140" r="118" fill="none" stroke="url(#rust-grad)" stroke-width="6"/>
      <g fill="url(#rust-grad)" stroke="url(#rust-grad)" stroke-width="3">
        <rect x="132" y="6" width="16" height="36" rx="3"/>
        <rect x="132" y="238" width="16" height="36" rx="3"/>
        <rect x="6" y="132" width="36" height="16" rx="3"/>
        <rect x="238" y="132" width="36" height="16" rx="3"/>
        <rect x="40" y="40" width="22" height="22" rx="3" transform="rotate(45 51 51)"/>
        <rect x="218" y="40" width="22" height="22" rx="3" transform="rotate(45 229 51)"/>
        <rect x="40" y="218" width="22" height="22" rx="3" transform="rotate(45 51 229)"/>
        <rect x="218" y="218" width="22" height="22" rx="3" transform="rotate(45 229 229)"/>
      </g>
      <circle cx="140" cy="140" r="78" fill="#0d1117" stroke="url(#rust-grad)" stroke-width="4"/>
    </g>
    <g id="title-mark-r" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-weight="800">
      <text x="140" y="172" font-size="100" fill="url(#rust-grad)" text-anchor="middle">R</text>
    </g>
    <g id="title-mark-lambda" transform="translate(220, 220)">
      <circle cx="0" cy="0" r="34" fill="#0d1117" stroke="url(#lambda-grad)" stroke-width="4"/>
      <text x="0" y="14" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="46" font-weight="800" fill="url(#lambda-grad)" text-anchor="middle">λ</text>
    </g>
  </g>

  <g id="title-text" transform="translate(440, 230)" font-family="'Inter','Helvetica Neue',sans-serif">
    <text x="0" y="0" font-size="72" font-weight="800" fill="#f0f6fc" letter-spacing="-1">Rust Serverless</text>
    <text x="0" y="86" font-size="72" font-weight="800" fill="#f0f6fc" letter-spacing="-1">Data Engineering</text>
    <g id="title-tag" transform="translate(0, 130)">
      <rect x="0" y="0" width="402" height="44" rx="22" fill="none" stroke="#3d8bff" stroke-width="2.5" opacity="0.9"/>
      <text x="201" y="30" font-size="20" font-weight="600" fill="#5cc8ff" text-anchor="middle" letter-spacing="2">cargo lambda · 100% covered · contract-first</text>
    </g>
  </g>

  <g id="dataflow" transform="translate(950, 410)">
    <g id="dataflow-pipe">
      <path d="M0 0 H 360" stroke="url(#pipe-grad)" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M0 0 H 360" stroke="#5cc8ff" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="8 14" opacity="0.9"/>
    </g>
    <g id="dataflow-input" transform="translate(-30, -30)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#161b22" stroke="#3d8bff" stroke-width="3.5"/>
      <text x="30" y="38" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#5cc8ff" text-anchor="middle">{ }</text>
      <text x="30" y="84" font-family="'Inter',sans-serif" font-size="16" fill="#8da4c4" text-anchor="middle">event</text>
    </g>
    <g id="dataflow-handler" transform="translate(150, -42)">
      <rect x="0" y="0" width="84" height="84" rx="14" fill="#161b22" stroke="url(#lambda-grad)" stroke-width="4"/>
      <text x="42" y="56" font-family="'JetBrains Mono',monospace" font-size="44" font-weight="800" fill="#ff9900" text-anchor="middle">λ</text>
      <text x="42" y="108" font-family="'Inter',sans-serif" font-size="16" fill="#ffb84d" text-anchor="middle">recho</text>
    </g>
    <g id="dataflow-output" transform="translate(330, -30)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#161b22" stroke="#3d8bff" stroke-width="3.5"/>
      <text x="30" y="38" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#5cc8ff" text-anchor="middle">↦</text>
      <text x="30" y="84" font-family="'Inter',sans-serif" font-size="16" fill="#8da4c4" text-anchor="middle">echo</text>
    </g>
  </g>

  <g id="dark-side" transform="translate(1450, 200)">
    <circle cx="0" cy="0" r="106" fill="url(#moon-grad)" stroke="#3a4356" stroke-width="3"/>
    <g id="dark-side-craters" fill="#1a2030" opacity="0.9">
      <circle cx="-30" cy="-22" r="14"/>
      <circle cx="22" cy="10" r="9"/>
      <circle cx="-12" cy="36" r="11"/>
      <circle cx="40" cy="-40" r="6"/>
      <circle cx="-50" cy="18" r="7"/>
    </g>
    <text x="0" y="158" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#8da4c4" text-anchor="middle">dark ECHO</text>
  </g>

  <g id="light-side" transform="translate(1700, 200)">
    <circle cx="0" cy="0" r="120" fill="url(#bulb-halo)" filter="url(#soft-glow)"/>
    <g id="light-side-bulb">
      <ellipse cx="0" cy="-12" rx="62" ry="68" fill="url(#bulb-grad)" stroke="#a37500" stroke-width="3"/>
      <rect x="-22" y="46" width="44" height="14" rx="3" fill="#3a3026" stroke="#1c1813" stroke-width="2"/>
      <rect x="-26" y="58" width="52" height="10" rx="3" fill="#2a2118" stroke="#1c1813" stroke-width="2"/>
      <rect x="-30" y="66" width="60" height="8" rx="3" fill="#1c1813"/>
      <path d="M-18 -28 Q 0 -8 -10 18" fill="none" stroke="#a37500" stroke-width="3"/>
      <path d="M18 -28 Q 0 -8 10 18" fill="none" stroke="#a37500" stroke-width="3"/>
    </g>
    <g id="light-side-rays" stroke="#ffd84a" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="-90" y1="-90" x2="-110" y2="-110"/>
      <line x1="0" y1="-100" x2="0" y2="-128"/>
      <line x1="90" y1="-90" x2="110" y2="-110"/>
      <line x1="-105" y1="0" x2="-130" y2="0"/>
      <line x1="105" y1="0" x2="130" y2="0"/>
    </g>
    <text x="0" y="158" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#ffd84a" text-anchor="middle">light ECHO</text>
  </g>

  <g id="footer" font-family="'JetBrains Mono',monospace" font-size="18" fill="#8da4c4">
    <text x="120" y="588">Provable contract · cargo llvm-cov --fail-under 100 · pmat comply</text>
    <text x="1800" y="588" text-anchor="end">paiml/rust-de-specialization · c6</text>
  </g>
</svg>
